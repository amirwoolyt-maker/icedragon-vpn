# Cross-platform Desktop + Android release workflow (Windows, Linux, macOS, Android).
# Runs on manual dispatch or whenever a push commit message includes `[with-desktop]`,
# creating a single atomic GitHub Release containing Desktop + Android assets together
# so immutable releases never block attaching desktop installers.

name: Build IceDragon VPN Desktop

on:
  push:
    branches: [main, master]
    paths-ignore: ['docs/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish unified GitHub Release v<pubspec version> (Desktop + Android)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.sha }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GOMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[with-desktop]')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          v="$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Update manifest check
        run: |
          jq -e 'type == "object"
            and all(keys[]; IN("android", "linux", "macos", "windows"))
            and all(.[]; type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' .github/updates.json >/dev/null

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Core tests & vet
        working-directory: core
        run: |
          go vet ./...
          go test -count=1 ./...
          go vet -tags with_gvisor ./internal/tunstack/
          go test -count=1 -tags with_gvisor ./internal/tunstack/

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter analyze & tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub --reporter expanded

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
      - name: Build Windows app & installer
        shell: pwsh
        env:
          ARMAN_VPN_SIGNING_KEY: ${{ secrets.FIREFOX_VPN_SIGNING_KEY }}
        run: .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            dist/IceDragon-VPN-*-Windows-x64.zip
            dist/IceDragon-VPN-*-Windows-Setup-x64.exe
          if-no-files-found: error

  linux:
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'amd64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter (ARM64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev curl xz-utils zip unzip libglu1-mesa
      - name: Build Linux desktop bundle
        env:
          ARMAN_VPN_SIGNING_KEY: ${{ secrets.FIREFOX_VPN_SIGNING_KEY }}
        run: bash scripts/build-linux.sh
      - name: Build Linux headless core
        if: matrix.arch == 'amd64'
        run: bash scripts/build-linux-core.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-${{ matrix.arch }}
          path: |
            dist/IceDragon-VPN-*-Linux-*.tar.gz
            dist/arman-vpn-core-linux-*.tar.gz
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build macOS DMG & update archive
        env:
          ARMAN_VPN_SIGNING_KEY: ${{ secrets.FIREFOX_VPN_SIGNING_KEY }}
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: |
            dist/IceDragon-VPN-*-macOS.dmg
            dist/IceDragon-VPN-*-macOS.tar.gz
          if-no-files-found: error

  android:
    needs: test
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[with-desktop]')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: NDK and gomobile
        run: |
          ndk="$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/android/app/build.gradle.kts)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION" "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"
      - name: Cache fallback debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: icedragon-debug-keystore-v1
      - name: Release keystore (optional)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            mkdir -p ~/.android
            if [ ! -f ~/.android/debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore ~/.android/debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > app/android/release.jks
          printf 'storeFile=../release.jks\nstorePassword=%s\nkeyAlias=release\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > app/android/key.properties
      - name: Build IceDragon VPN core & APKs
        run: |
          v='${{ needs.test.outputs.version }}'
          mkdir -p app/android/app/libs
          flags="-s -w -X github.com/armanlife/arman-vpn-client/core/internal/version.Current=$v"
          (cd core && gomobile bind -target=android -androidapi 24 -trimpath \
            -ldflags "$flags" \
            -o ../app/android/app/libs/core.aar ./mobile)
          cd app
          flutter pub get
          mkdir -p ../out
          flutter build apk --release --split-per-abi --dart-define=APP_VERSION=$v
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../out/IceDragon-VPN-Android-$abi.apk"
          done
          flutter build apk --release --dart-define=APP_VERSION=$v
          cp build/app/outputs/flutter-apk/app-release.apk ../out/IceDragon-VPN-Android-universal.apk
      - name: Remove keystore files
        if: always()
        run: rm -f app/android/release.jks app/android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: icedragon-vpn-apks
          path: out/*.apk
          if-no-files-found: error

  publish-release:
    needs: [test, windows, linux, macos, android]
    if: ${{ !failure() && !cancelled() && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[with-desktop]')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-out
          merge-multiple: true
      - name: Prepare versioned/fixed assets & checksums
        working-directory: release-out
        run: |
          v="${{ needs.test.outputs.version }}"
          for f in IceDragon-VPN-Android-*.apk; do
            if [ -f "$f" ]; then
              cp "$f" "IceDragon-VPN-$v-${f#IceDragon-VPN-}"
            fi
          done
          for f in IceDragon-VPN-"$v"-Windows-* IceDragon-VPN-"$v"-Linux-* IceDragon-VPN-"$v"-macOS.*; do
            if [ -f "$f" ]; then
              cp "$f" "IceDragon-VPN-${f#IceDragon-VPN-${v}-}"
            fi
          done
          sha256sum IceDragon-VPN-* arman-vpn-core-linux-* > SHA256SUMS.txt
          printf '# IceDragon VPN version: %s\n' "$v" >> SHA256SUMS.txt
          ls -lh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.test.outputs.version }}"
          tag="v$v"
          bash scripts/release-notes.sh "$tag" > notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if out="$(gh release upload "$tag" release-out/* --repo "$GITHUB_REPOSITORY" --clobber 2>&1)"; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
                --title "IceDragon VPN $v" \
                --notes-file notes.md \
                --latest
            elif echo "$out" | grep -qi "immutable"; then
              echo "::warning::Release $tag already exists and is immutable. Bump version in app/pubspec.yaml to publish a new release."
            else
              echo "$out" >&2
              exit 1
            fi
          else
            gh release create "$tag" release-out/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "IceDragon VPN $v" \
              --notes-file notes.md \
              --latest
          fi
