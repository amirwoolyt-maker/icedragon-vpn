name: Keep Android Keystore Cache Alive

on:
  schedule:
    # Touch the fallback signing keystore every 5 days so GitHub's 7-day
    # unused-cache eviction never rotates the app signature unexpectedly.
    - cron: '15 3 */5 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-24.04
    steps:
      - name: Restore cached debug keystore
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: icedragon-debug-keystore-v1

      - name: Report status
        env:
          HAS_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_SECRET" = "true" ]; then
            echo "Permanent release keystore secret is configured."
          elif [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "Refreshed fallback debug keystore cache TTL (icedragon-debug-keystore-v1)."
          else
            echo "::warning::Fallback debug keystore cache not found yet; next Android build will initialize it."
          fi
